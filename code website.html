<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TokoKita — Belanja Online</title>
  <style>
    :root {
      --primary: #6c5ce7;
      --background: #f7f7fb;
      --text: #25243a;
      --muted: #77768a;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--background);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--white);
      box-shadow: 0 2px 12px #24213b0d;
    }

    .navbar {
      max-width: 1100px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
    .cart-button, button, select, input { font: inherit; }

    .cart-button, .add-button {
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 650;
    }

    .cart-button:hover, .add-button:hover { background: #5948d5; }

    main { max-width: 1100px; margin: auto; padding: 28px 20px 60px; }

    .hero {
      padding: 34px;
      border-radius: 18px;
      color: white;
      background: linear-gradient(120deg, #6c5ce7, #a29bfe);
      margin-bottom: 28px;
    }

    .hero h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 5vw, 2.5rem); }
    .hero p { margin: 0; opacity: .9; }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .controls input, .controls select {
      background: white;
      border: 1px solid #e6e5ee;
      border-radius: 10px;
      padding: 11px 13px;
      outline-color: var(--primary);
    }

    .controls input { flex: 1; min-width: 0; }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 16px #24213b0a;
    }

    .product-image {
      height: 155px;
      display: grid;
      place-items: center;
      background: #eeecff;
      font-size: 4.5rem;
    }

    .card-content { padding: 16px; }
    .category { color: var(--muted); font-size: .82rem; }
    .card h2 { font-size: 1.05rem; margin: 6px 0; }
    .price { color: var(--primary); font-weight: 750; margin: 12px 0; }
    .add-button { width: 100%; }

    .empty { color: var(--muted); text-align: center; padding: 36px; }

    dialog {
      border: 0;
      border-radius: 16px;
      width: min(440px, calc(100% - 28px));
      padding: 22px;
      box-shadow: 0 15px 50px #16142c40;
    }

    dialog::backdrop { background: #17152b80; }
    .dialog-header { display: flex; justify-content: space-between; align-items: center; }
    .dialog-header h2 { margin: 0; }
    .close-button { border: 0; background: transparent; font-size: 1.5rem; cursor: pointer; }
    .cart-item { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #eee; }
    .cart-item small { color: var(--muted); }
    .remove-button { border: 0; background: transparent; color: #d63031; cursor: pointer; }
    .total { display: flex; justify-content: space-between; font-weight: 750; margin: 18px 0; }
    .checkout { width: 100%; border: 0; border-radius: 10px; padding: 12px; background: #00b894; color: white; font-weight: 700; cursor: pointer; }

    @media (max-width: 520px) {
      .navbar { padding-inline: 14px; }
      main { padding-inline: 14px; }
      .hero { padding: 25px 20px; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">TokoKita</div>
      <button class="cart-button" id="openCart">
        🛒 Keranjang <span id="cartCount">0</span>
      </button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Belanja mudah, harga bersahabat!</h1>
      <p>Temukan produk favoritmu dan belanja dengan nyaman.</p>
    </section>

    <section class="controls" aria-label="Cari dan filter produk">
      <input id="searchInput" type="search" placeholder="Cari produk..." />
      <select id="categoryFilter" aria-label="Filter kategori">
        <option value="Semua">Semua kategori</option>
        <option value="Elektronik">Elektronik</option>
        <option value="Fashion">Fashion</option>
        <option value="Rumah">Rumah</option>
      </select>
    </section>

    <section class="products" id="productList" aria-live="polite"></section>
  </main>

  <dialog id="cartDialog">
    <div class="dialog-header">
      <h2>Keranjang Belanja</h2>
      <button class="close-button" id="closeCart" aria-label="Tutup">×</button>
    </div>
    <div id="cartItems"></div>
    <div class="total">
      <span>Total</span>
      <span id="cartTotal">Rp0</span>
    </div>
    <button class="checkout" id="checkoutButton">Lanjutkan Checkout</button>
  </dialog>

  <script>
    const products = [
      { id: 1, name: "Headphone Wireless", category: "Elektronik", price: 250000, icon: "🎧" },
      { id: 2, name: "Jam Tangan Minimalis", category: "Fashion", price: 180000, icon: "⌚" },
      { id: 3, name: "Lampu Meja", category: "Rumah", price: 125000, icon: "💡" },
      { id: 4, name: "Tas Selempang", category: "Fashion", price: 210000, icon: "👜" },
      { id: 5, name: "Speaker Bluetooth", category: "Elektronik", price: 320000, icon: "🔊" },
      { id: 6, name: "Tanaman Hias", category: "Rumah", price: 85000, icon: "🪴" }
    ];

    const cart = [];
    const productList = document.getElementById("productList");
    const cartDialog = document.getElementById("cartDialog");
    const rupiah = value => new Intl.NumberFormat("id-ID", {
      style: "currency", currency: "IDR", maximumFractionDigits: 0
    }).format(value);

    function renderProducts() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const category = document.getElementById("categoryFilter").value;
      const filtered = products.filter(product =>
        product.name.toLowerCase().includes(search) &&
        (category === "Semua" || product.category === category)
      );

      productList.innerHTML = filtered.length
        ? filtered.map(product => `
          <article class="card">
            <div class="product-image" aria-hidden="true">${product.icon}</div>
            <div class="card-content">
              <span class="category">${product.category}</span>
              <h2>${product.name}</h2>
              <div class="price">${rupiah(product.price)}</div>
              <button class="add-button" onclick="addToCart(${product.id})">
                Tambah ke Keranjang
              </button>
            </div>
          </article>
        `).join("")
        : '<p class="empty">Produk tidak ditemukan.</p>';
    }

    function addToCart(id) {
      const item = cart.find(product => product.id === id);
      if (item) item.quantity++;
      else cart.push({ ...products.find(product => product.id === id), quantity: 1 });
      renderCart();
    }

    function removeFromCart(id) {
      const index = cart.findIndex(item => item.id === id);
      if (index !== -1) cart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      document.getElementById("cartCount").textContent = count;
      document.getElementById("cartTotal").textContent = rupiah(total);
      document.getElementById("cartItems").innerHTML = cart.length
        ? cart.map(item => `
          <div class="cart-item">
            <div>${item.icon} ${item.name}<br><small>${item.quantity} × ${rupiah(item.price)}</small></div>
            <button class="remove-button" onclick="removeFromCart(${item.id})">Hapus</button>
          </div>
        `).join("")
        : '<p class="empty">Keranjangmu masih kosong.</p>';
    }

    document.getElementById("searchInput").addEventListener("input", renderProducts);
    document.getElementById("categoryFilter").addEventListener("change", renderProducts);
    document.getElementById("openCart").addEventListener("click", () => cartDialog.showModal());
    document.getElementById("closeCart").addEventListener("click", () => cartDialog.close());
    document.getElementById("checkoutButton").addEventListener("click", () => {
      if (!cart.length) return alert("Keranjangmu masih kosong.");
      alert("Terima kasih! Fitur pembayaran bisa ditambahkan berikutnya.");
    });

    renderProducts();
    renderCart();
  </script>
</body>
</html>
